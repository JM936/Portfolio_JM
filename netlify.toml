[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://choices.consentframework.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://choices.consentframework.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://raw.githubusercontent.com https://www.google-analytics.com https://www.googletagmanager.com https://choices.consentframework.com https://*.consentframework.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.googletagmanager.com https://choices.consentframework.com https://*.consentframework.com; frame-src 'self' https://choices.consentframework.com https://*.consentframework.com;"
